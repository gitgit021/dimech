let running=false,timer,winner='';const reel=document.querySelector('#reel');const names={dine:'🍽️ 외식',delivery:'🛵 배달',home:'🍳 만들어 먹기'};const checked=()=>[...document.querySelectorAll('input:checked')].map(x=>x.value);const pool=()=>[...new Set(checked().flatMap(k=>P[k]))];const eligible=m=>checked();function render(a){document.querySelector('#reel').innerHTML=[...a,...a].map(x=>`<div class="item">${x}</div>`).join('')}function stats(){document.querySelector('#count').textContent=pool().length+'개';document.querySelectorAll('[data-count]').forEach(el=>el.textContent=P[el.dataset.count].length);render(pool().slice(0,8))}document.querySelectorAll('input').forEach(x=>x.onchange=stats);
